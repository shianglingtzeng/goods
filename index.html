<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的物品</title>
<meta name="theme-color" content="#faf9f5">
<style>
:root{
  --bg:#faf9f5; --card:#faf9f5; --field:#f0eee6; --text:#1f1e1c; --muted:#8a867b; --line:#e8e4d9;
  --brand:#c96442; --brand-ink:#ffffff;
  --red:#b5452f; --amber:#a8731c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;
  padding-top:max(14px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:6px;min-height:40px}
.top h1{flex:1;min-width:0;font-size:26px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;font-size:30px;line-height:1;padding:0 6px 4px 0;color:var(--brand)}
.link{background:none;border:0;color:var(--muted);font-size:14px;padding:6px}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.chips:empty{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;font-size:14px}
.chip b{margin-left:4px}
.chip.red b{color:var(--red)} .chip.amber b{color:var(--amber)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on b{color:inherit}
.search{width:100%;margin-top:10px;border:0;background:var(--field);border-radius:10px;padding:10px 12px;font-size:15px}
main{padding:4px 16px 110px}

/* 區域列表 */
.arow{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.aemoji{width:46px;height:46px;border-radius:14px;background:var(--field);display:grid;place-items:center;font-size:24px;flex:0 0 46px}
.arow .name{font-size:18px}
.flags{font-size:13px;margin-top:3px}
.flags .r{color:var(--red);font-weight:600;margin-right:8px}
.flags .a{color:var(--amber);font-weight:600;margin-right:8px}
.chev{color:var(--muted);font-size:22px}
.addarea{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--brand);padding:18px 2px;font-size:16px}

/* 物品列表 */
.card{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer}
.card.empty{opacity:.5}
.thumb{width:52px;height:52px;border-radius:50%;background:var(--field);flex:0 0 52px;
  display:grid;place-items:center;overflow:hidden;font-size:22px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.expired .name::before{content:"● ";color:var(--red)}
.card.soon .name::before{content:"● ";color:var(--amber)}
.meta{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:13px;font-weight:600;margin-top:3px;margin-right:6px;color:var(--muted)}
.badge.expired{color:var(--red)} .badge.soon{color:var(--amber)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:600}
.card .movebtn{flex:0 0 auto;padding:8px 12px;font-size:14px}
.emptystate{text-align:center;color:var(--muted);padding:56px 20px;line-height:1.8}
.emptystate .btn{margin-top:14px}

#fab{position:fixed;right:20px;bottom:max(22px,env(safe-area-inset-bottom));min-width:58px;height:58px;border-radius:16px;
  border:0;background:var(--brand);color:var(--brand-ink);font-size:16px;font-weight:600;padding:0 18px;
  box-shadow:0 6px 18px rgba(60,40,20,.25)}
#login{padding:72px 24px;text-align:center;line-height:1.7}
#login h1{font-size:28px;margin:0 0 4px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;background:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5}

dialog{border:0;border-radius:18px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--bg);color:var(--text)}
dialog::backdrop{background:rgba(30,25,15,.45)}
form{padding:18px}
form h2{margin:0 0 12px;font-size:20px;font-weight:600}
.photo{width:100%;aspect-ratio:4/3;border-radius:12px;background:var(--field);
  display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:contain}
.photorow{display:flex;gap:8px;margin-top:8px}
.photorow .btn{flex:1;padding:10px;font-size:15px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.f{width:100%;border:1px solid transparent;background:var(--field);border-radius:10px;padding:10px 11px;font-size:16px}
.f:focus{outline:none;border-color:var(--brand)}
.row{display:flex;gap:10px} .row>div{flex:1;min-width:0}
.warn{background:#f6ead6;color:#8a5a12;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .grow{flex:1}
.hint{font-size:13px;color:var(--muted)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow-y:auto;padding-bottom:4px}
.egroup{flex:0 0 100%;font-size:12px;color:var(--muted);margin:6px 0 0}
/* 首頁總覽 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stat{background:var(--field);border:0;border-radius:14px;padding:12px 10px;text-align:left}
.stat .n{display:block;font-size:28px;font-weight:700;line-height:1.1;font-family:"Noto Serif TC","Songti TC",Georgia,serif}
.stat .l{font-size:13px;color:var(--muted)}
.stat.r .n{color:var(--red)} .stat.a .n{color:var(--amber)}
.stat.zero .n{color:var(--muted)}
.sub{font-size:13px;color:var(--muted);margin:2px 2px 0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 0;
  font-size:13px;letter-spacing:.5px;color:var(--muted);font-weight:600}
.allgood{padding:14px 2px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.emojis button{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:var(--field);font-size:22px}
.emojis button.on{border-color:var(--brand);background:#f4e4dc}
/* QR 標籤 */
.labels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.lab{border:1px dashed var(--line);border-radius:14px;padding:12px 10px;text-align:center;background:#fff}
.lab .lname{font-size:16px;font-weight:600;margin-bottom:6px}
.lab .qr svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
.lab .lbtn{margin-top:8px;font-size:13px;padding:6px 10px}
.tabs{display:flex;gap:8px;margin:4px 0 10px}
.where{background:#f4e4dc;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:16px;line-height:1.5}
.where b{display:block;font-size:13px;color:var(--brand);font-weight:600;margin-bottom:2px}
.lab .lsub{font-size:12px;color:var(--muted);margin:-4px 0 6px}
.secbtn{background:none;border:0;color:var(--brand);font-size:13px;font-weight:600;padding:0}
@media print{
  header,#fab,.noprint{display:none!important}
  html,body{background:#fff}
  main{padding:0}
  .labels{grid-template-columns:repeat(3,1fr)}
  .lab{break-inside:avoid;border-color:#999}
}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="setup" class="emptystate" hidden>
  <h2>還沒設定 Firebase</h2>
  請在 index.html 裡找到 <code>firebaseConfig</code>,貼上你 Firebase 專案的設定後重新整理。
</div>

<div id="login" hidden>
  <h1 class="serif">📦 我的物品</h1>
  <p class="hint">記錄東西放在哪、有幾個、什麼時候過期</p>
  <button class="btn" id="loginBtn">用 Google 登入</button>
  <div style="max-width:320px;margin:28px auto 0;text-align:left">
    <p class="hint" style="text-align:center">或用電子郵件登入</p>
    <input class="f" id="email" type="email" placeholder="電子郵件" autocomplete="email">
    <input class="f" id="pw" type="password" placeholder="密碼(至少 6 碼)" autocomplete="current-password" style="margin-top:8px">
    <div class="row" style="margin-top:10px">
      <button class="btn" id="emailLogin" style="flex:1">登入</button>
      <button class="btn ghost" id="emailSignup" style="flex:1">建立帳號</button>
    </div>
  </div>
  <p class="warn" id="loginErr" hidden style="max-width:320px;margin:16px auto 0"></p>
</div>

<div id="app" hidden>
  <header>
    <div class="top">
      <button class="back" id="backBtn" hidden aria-label="返回">‹</button>
      <h1 class="serif" id="title">我的物品</h1>
      <button class="link" id="topLink">登出</button>
    </div>
    <div class="chips" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="搜尋全部(買之前先查一下!)">
  </header>
  <main id="list"></main>
  <button id="fab">＋ 區域</button>
</div>

<!-- 區域編輯 -->
<dialog id="areaDlg">
  <form id="areaForm" method="dialog">
    <h2 id="areaTitle">新增區域</h2>
    <label for="aName">區域名稱 *</label>
    <input class="f" id="aName" required autocomplete="off" placeholder="例:廚房、浴室、臥室衣櫃">
    <label>圖示</label>
    <div class="emojis" id="emojiPick"></div>
    <label for="aEmoji">找不到喜歡的?直接用鍵盤輸入任何表情符號</label>
    <input class="f" id="aEmoji" autocomplete="off" placeholder="例:🐟" style="width:110px;font-size:22px;text-align:center">
    <div id="aLinkBox" hidden>
      <label for="aLink">NFC / QR 網址(手機碰標籤就會直接打開這個區域)</label>
      <div style="display:flex;gap:8px">
        <input class="f" id="aLink" readonly style="flex:1;min-width:0;font-size:13px">
        <button type="button" class="btn ghost" id="aCopy" style="flex:0 0 auto;padding:10px 14px">複製</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="aDel" hidden>刪除</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost" id="aCancel">取消</button>
      <button type="submit" class="btn" id="aSave">儲存</button>
    </div>
  </form>
</dialog>

<!-- 物品編輯 -->
<dialog id="editor">
  <form id="form" method="dialog">
    <h2 id="formTitle">新增物品</h2>
    <div class="where" id="whereBox" hidden></div>

    <div class="photo" id="photoBox"><span>還沒有照片</span></div>
    <div class="photorow">
      <button type="button" class="btn ghost" id="pickPhoto">📷 拍照 / 選照片</button>
      <button type="button" class="btn ghost" id="removePhoto" hidden>移除</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>

    <label for="fName">名稱 *</label>
    <input class="f" id="fName" required autocomplete="off">
    <div class="warn" id="dupWarn" hidden></div>

    <div class="row">
      <div>
        <label for="fQty">數量</label>
        <input class="f" id="fQty" type="number" inputmode="numeric" min="0" value="1">
      </div>
      <div>
        <label for="fExpiry">過期日</label>
        <input class="f" id="fExpiry" type="date">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="fArea">區域</label>
        <select class="f" id="fArea"></select>
      </div>
      <div>
        <label for="fLoc">細部位置</label>
        <input class="f" id="fLoc" list="locList" placeholder="例:上櫃、第二層">
      </div>
    </div>
    <datalist id="locList"></datalist>

    <label for="fNote">備註</label>
    <textarea class="f" id="fNote" rows="2"></textarea>

    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>刪除</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost" id="cancelBtn">取消</button>
      <button type="submit" class="btn" id="saveBtn">儲存</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut,
  signInWithEmailAndPassword, createUserWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== Firebase 設定 ====== */
const firebaseConfig = {
  apiKey: "AIzaSyAWq6AH_ScRfbS4oeKo8c5kUX7AiMzhKFw",
  authDomain: "goods-ecfab.firebaseapp.com",
  projectId: "goods-ecfab",
  storageBucket: "goods-ecfab.firebasestorage.app",
  messagingSenderId: "529281012280",
  appId: "1:529281012280:web:df8194b5c7de2435478ccd",
  measurementId: "G-MKFD3QBYTE"
};
/* 幾天內算「快過期」 */
const SOON_DAYS = 7;
/* 區域可選的圖示 */
const EMOJI_GROUPS = [
  ["空間", ["🍳","🧊","🛁","🚿","🚽","🛏️","🛋️","🚪","🪟","🪴","🏠","🏢","🚗","🧳","🎒","👜"]],
  ["收納", ["📦","🗄️","🧺","🗃️","🪣","🧰","🛒","🏷️"]],
  ["食物", ["🥫","🍝","🍚","🍞","🥛","🧀","🥚","🍎","🥬","🧂","🫙","🍫","🍪","☕","🍵","🍷","🧃","🥤"]],
  ["清潔日用", ["🧴","🧼","🧽","🧹","🧻","🪥","🫧","🧷","🔋","💡","🕯️","🪒"]],
  ["保養健康", ["💄","💅","🪞","💊","🩹","🩺","🌡️","😷"]],
  ["衣物配件", ["👕","👖","👗","🧥","🧦","👟","👠","🧣","🧤","🎩","👓","💍"]],
  ["其他", ["📚","✏️","📎","🖇️","💻","📱","🔌","🎧","🎮","🧸","🎁","🐱","🐶","🪡","🔧","🔑","⭐","❤️"]]
];
const EMOJIS = EMOJI_GROUPS.flatMap(g => g[1]);
/* ========================== */

const $ = id => document.getElementById(id);
if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("請")) {
  $("setup").hidden = false;
  throw new Error("Firebase not configured");
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

let uid = null, unsubs = [], items = [], areas = [];
const state = { area: null, view: "all", q: "", labels: false, labelTab: "area" };   // area: null = 首頁
/* 從網址 ?area=xxx 直接打開某個區域(NFC / QR 用) */
const params = new URLSearchParams(location.search);
let pendingArea = params.get("area");
let pendingItem = params.get("item");
const BASE_URL = location.origin + location.pathname;
const areaURL = id => `${BASE_URL}?area=${encodeURIComponent(id)}`;
let editing = null, editingArea = null;
let photo = { changed: false, full: null, thumb: null };
const NO_AREA = "__none__";

/* ---------- 登入 ---------- */
const loginMsg = {
  "auth/popup-blocked": "彈出視窗被擋住了,請允許此網站的彈出視窗,或改用電子郵件登入。",
  "auth/popup-closed-by-user": "登入視窗被關閉了,請再試一次。",
  "auth/cancelled-popup-request": "登入視窗被關閉了,請再試一次。",
  "auth/unauthorized-domain": "這個網域還沒加入 Firebase 的授權網域。",
  "auth/operation-not-allowed": "Firebase 裡還沒啟用這種登入方式。",
  "auth/invalid-credential": "電子郵件或密碼錯誤。",
  "auth/wrong-password": "電子郵件或密碼錯誤。",
  "auth/user-not-found": "找不到這個帳號,請先按「建立帳號」。",
  "auth/email-already-in-use": "這個信箱已經建立過帳號,請直接登入。",
  "auth/weak-password": "密碼至少要 6 碼。",
  "auth/invalid-email": "電子郵件格式不正確。"
};
function showLoginErr(e) {
  const box = $("loginErr");
  box.hidden = false;
  box.textContent = (loginMsg[e.code] || e.message || "登入失敗") + (e.code ? `(${e.code})` : "");
}
$("loginBtn").onclick = async () => {
  $("loginErr").hidden = true;
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { showLoginErr(e); }
};
async function emailAuth(create) {
  $("loginErr").hidden = true;
  const em = $("email").value.trim(), pw = $("pw").value;
  if (!em || !pw) { showLoginErr({ message: "請輸入電子郵件和密碼" }); return; }
  try {
    if (create) await createUserWithEmailAndPassword(auth, em, pw);
    else await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) { showLoginErr(e); }
}
$("emailLogin").onclick = () => emailAuth(false);
$("emailSignup").onclick = () => emailAuth(true);

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  uid = user ? user.uid : null;
  $("login").hidden = !!user;
  $("app").hidden = !user;
  if (!user) return;
  Object.assign(state, { area: null, view: "all", q: "", labels: false, labelTab: "area" });
  $("search").value = "";
  const onErr = err => alert("讀取失敗:" + err.message);
  unsubs.push(onSnapshot(collection(db, "users", uid, "areas"), snap => {
    areas = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    if (pendingArea) {
      if (areas.some(a => a.id === pendingArea)) {
        Object.assign(state, { area: pendingArea, view: "all", q: "", labels: false });
        pendingArea = null;
      } else if (!snap.metadata.fromCache) {
        pendingArea = null;   // 區域不存在(可能已刪除)
      }
    }
    render();
    if (pendingItem && areas.length) {
      const it = items.find(i => i.id === pendingItem);
      if (it) {
        pendingItem = null;
        history.replaceState(null, "", location.pathname);
        if (areaOf(it)) state.area = it.areaId;
        render();
        openEditor(it);
      }
    }
  }, onErr));
  unsubs.push(onSnapshot(collection(db, "users", uid, "items"), snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    if (pendingItem) {
      const it = items.find(i => i.id === pendingItem);
      if (it && areas.length) {
        pendingItem = null;
        history.replaceState(null, "", location.pathname);
        if (areaOf(it)) state.area = it.areaId;
        render();
        openEditor(it);
      } else if (!it && !snap.metadata.fromCache) {
        pendingItem = null;
        history.replaceState(null, "", location.pathname);
        alert("找不到這個物品,可能已經被刪除了。");
      }
    }
  }, onErr));
});

/* ---------- 工具 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").trim().toLowerCase();
const areaOf = it => areas.find(a => a.id === it.areaId);
const areaKey = it => areaOf(it) ? it.areaId : NO_AREA;
const areaLabel = id => {
  if (id === NO_AREA) return { emoji: "📦", name: "未分區" };
  return areas.find(a => a.id === id) || { emoji: "📦", name: "未分區" };
};

function daysLeft(exp) {
  if (!exp) return null;
  const [y, m, d] = exp.split("-").map(Number);
  const t = new Date(y, m - 1, d);
  const n = new Date(); n.setHours(0, 0, 0, 0);
  return Math.round((t - n) / 86400000);
}
function statusOf(it) {
  const d = daysLeft(it.expiry);
  if (d === null) return "none";
  if (d < 0) return "expired";
  if (d <= SOON_DAYS) return "soon";
  return "ok";
}
function expiryText(it) {
  const d = daysLeft(it.expiry);
  if (d === null) return "";
  if (d < 0) return `已過期 ${-d} 天`;
  if (d === 0) return "今天到期";
  if (d <= SOON_DAYS) return `還有 ${d} 天`;
  return `到期 ${it.expiry}`;
}
/* 多久前更新(太久沒動,代表東西可能已經不在那裡了) */
function agoText(it) {
  const t = (it.updatedAt || it.createdAt)?.toDate?.();
  if (!t) return "";
  const d = Math.floor((Date.now() - t) / 86400000);
  return d <= 0 ? "今天更新" : d < 30 ? `${d} 天前更新` : `${Math.floor(d / 30)} 個月前更新`;
}
function byExpiry(a, b) {
  const da = daysLeft(a.expiry), dbb = daysLeft(b.expiry);
  if (da !== null && dbb !== null && da !== dbb) return da - dbb;
  if (da !== null && dbb === null) return -1;
  if (da === null && dbb !== null) return 1;
  return (a.name || "").localeCompare(b.name || "", "zh-Hant");
}
function counts(list) {
  const c = { all: list.length, expired: 0, soon: 0 };
  list.forEach(it => { const s = statusOf(it); if (s in c) c[s]++; });
  return c;
}

/* ---------- 畫面 ---------- */
function syncURL() {
  const want = (state.area && state.area !== NO_AREA && !state.labels) ? `?area=${encodeURIComponent(state.area)}` : "";
  if (location.search !== want && !pendingArea && !pendingItem) history.replaceState(null, "", location.pathname + want);
}

function qrSvg(text) {
  if (!window.qrcode) return `<p class="hint">QR 產生器載入失敗</p>`;
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

function renderLabels() {
  $("title").textContent = "🏷️ 區域標籤";
  $("backBtn").hidden = false;
  $("topLink").hidden = false;
  $("topLink").textContent = "列印";
  $("search").hidden = true;
  $("fab").hidden = true;
  $("chips").innerHTML = "";
  if (!areas.length) { $("list").innerHTML = `<div class="emptystate">還沒有區域</div>`; return; }
  $("list").innerHTML = `<p class="hint noprint">貼在箱子、抽屜、櫃子上,手機一碰就看到裡面有什麼。寫 NFC:按「複製網址」後用 NFC Tools App 寫入。</p>
    <div class="labels">${areas.map(a => `
      <div class="lab">
        <div class="lname">${esc(a.emoji)} ${esc(a.name)}</div>
        <div class="qr">${qrSvg(areaURL(a.id))}</div>
        <button class="btn ghost lbtn noprint" data-copy="${esc(areaURL(a.id))}">複製網址</button>
      </div>`).join("")}</div>`;
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    const old = btn.textContent; btn.textContent = "已複製 ✓";
    setTimeout(() => btn.textContent = old, 1500);
  } catch { prompt("請手動複製這個網址:", text); }
}

function render() {
  syncURL();
  if (state.labels) { renderLabels(); return; }
  $("search").hidden = false;
  const inArea = state.area !== null;
  if (inArea && state.area !== NO_AREA && !areas.some(a => a.id === state.area)) state.area = null;
  const scope = inArea ? items.filter(it => areaKey(it) === state.area) : items;
  const cnt = counts(scope);

  // 標題列
  const a = inArea ? areaLabel(state.area) : null;
  $("title").textContent = inArea ? `${a.emoji} ${a.name}` : "📦 我的物品";
  $("backBtn").hidden = !(inArea || state.view !== "all" || state.q);
  $("topLink").textContent = inArea ? (state.area === NO_AREA ? "" : "編輯區域") : "登出";
  $("topLink").hidden = inArea && state.area === NO_AREA;
  $("search").placeholder = inArea ? `在「${a.name}」裡搜尋` : "搜尋全部(買之前先查一下!)";
  $("fab").textContent = inArea ? "＋ 物品" : "＋ 區域";
  $("fab").hidden = inArea && state.area === NO_AREA;

  // 篩選標籤
  const chipDefs = inArea
    ? [["all", "全部", ""], ["expired", "已過期", "red"], ["soon", `${SOON_DAYS}天內到期`, "amber"]]
    : (state.view === "all" ? [] : [["expired", "已過期", "red"], ["soon", `${SOON_DAYS}天內到期`, "amber"]]);
  $("chips").innerHTML = chipDefs.map(([k, t, c]) =>
    `<button class="chip ${c} ${state.view === k ? "on" : ""}" data-view="${k}">${t}<b>${cnt[k]}</b></button>`
  ).join("");

  // 細部位置建議
  const locs = [...new Set(items.map(i => (i.location || "").trim()).filter(Boolean))].sort();
  $("locList").innerHTML = locs.map(c => `<option value="${esc(c)}">`).join("");

  // 首頁:區域列表
  if (!inArea && state.view === "all" && !state.q) { renderAreas(); return; }

  // 物品列表
  const q = norm(state.q);
  const list = scope.filter(it => {
    if (state.view !== "all" && statusOf(it) !== state.view) return false;
    if (q && ![it.name, it.location, it.note, areaLabel(areaKey(it)).name].some(v => norm(v).includes(q))) return false;
    return true;
  }).sort(byExpiry);

  // 在某個區域裡搜尋時,把「記錄在其他地方」的同名物品也列出來,可一鍵搬過來
  const others = (inArea && state.area !== NO_AREA && q)
    ? items.filter(it => areaKey(it) !== state.area &&
        [it.name, it.location, it.note].some(v => norm(v).includes(q)))
    : [];
  const moreHTML = others.length
    ? `<div class="sec"><span>其他地方也有</span></div>` +
      others.map(it => itemHTML(it, true).replace(
        /<div class="qty">[\s\S]*<\/div>\s*<\/article>/,
        `<button class="btn ghost movebtn" data-move="${it.id}">搬來這裡</button></article>`)).join("")
    : "";

  if (!list.length && !others.length) {
    $("list").innerHTML = `<div class="emptystate">${
      scope.length || q || state.view !== "all"
        ? "沒有符合的物品"
        : "這個區域還沒有東西<br>按右下角「＋ 物品」開始記錄"}</div>`;
    return;
  }
  $("list").innerHTML = list.map(it => itemHTML(it, !inArea)).join("") + moreHTML;
}

function renderAreas() {
  const keys = areas.map(a => a.id);
  if (items.some(it => areaKey(it) === NO_AREA)) keys.push(NO_AREA);
  if (!keys.length) {
    $("list").innerHTML = `<div class="emptystate">先建立幾個區域吧<br>例如:廚房、冰箱、浴室、臥室衣櫃
      <br><button class="btn" data-newarea>＋ 建立第一個區域</button></div>`;
    return;
  }

  // 總覽
  const c = counts(items);
  const inStock = items.filter(it => (it.qty ?? 0) > 0);
  const totalQty = inStock.reduce((s, it) => s + (it.qty ?? 0), 0);
  const urgent = items.filter(it => ["expired", "soon"].includes(statusOf(it))).sort(byExpiry);
  const overview = `
    <div class="stats">
      <button class="stat" data-scroll="areas"><span class="n">${c.all}</span><span class="l">樣物品</span></button>
      <button class="stat r ${c.expired ? "" : "zero"}" data-view="expired"><span class="n">${c.expired}</span><span class="l">已過期</span></button>
      <button class="stat a ${c.soon ? "" : "zero"}" data-view="soon"><span class="n">${c.soon}</span><span class="l">${SOON_DAYS} 天內到期</span></button>
    </div>
    <p class="sub">共 ${totalQty} 件庫存,分佈在 ${areas.length} 個區域</p>
    <div class="sec"><span>⚠️ 需要處理</span>${urgent.length ? `<span>${urgent.length} 樣</span>` : ""}</div>
    ${urgent.length
      ? urgent.map(it => itemHTML(it, true)).join("")
      : `<div class="allgood">✓ 目前沒有快過期或已過期的東西</div>`}
    <div class="sec" id="areasSec"><span>區域</span><button class="secbtn" data-labels>🏷️ QR 標籤</button></div>`;

  $("list").innerHTML = overview + keys.map(k => {
    const a = areaLabel(k);
    const c = counts(items.filter(it => areaKey(it) === k));
    return `<article class="arow" data-area="${k}">
      <div class="aemoji">${esc(a.emoji)}</div>
      <div class="info">
        <div class="name serif">${esc(a.name)}</div>
        <div class="flags">${c.expired ? `<span class="r">${c.expired} 已過期</span>` : ""}${
          c.soon ? `<span class="a">${c.soon} 快過期</span>` : ""}<span class="meta" style="display:inline">${c.all} 樣</span></div>
      </div>
      <span class="chev">›</span>
    </article>`;
  }).join("") + `<button class="addarea" data-newarea>＋ 新增區域</button>`;
}

function itemHTML(it, showArea) {
  const s = statusOf(it);
  const a = areaLabel(areaKey(it));
  const meta = [showArea ? `${a.emoji} ${a.name}` : "", it.location, agoText(it)].filter(Boolean).map(esc).join(" · ");
  const exp = expiryText(it);
  const empty = (it.qty ?? 0) <= 0;
  return `<article class="card ${s} ${empty ? "empty" : ""}" data-id="${it.id}">
    <div class="thumb">${it.thumb ? `<img src="${it.thumb}" alt="">` : "📦"}</div>
    <div class="info">
      <div class="name">${esc(it.name)}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
      ${exp ? `<span class="badge ${s}">${exp}</span>` : ""}${empty ? `<span class="badge">已用完</span>` : ""}
    </div>
    <div class="qty">
      <button data-act="dec" aria-label="減少">−</button>
      <span>${it.qty ?? 0}</span>
      <button data-act="inc" aria-label="增加">＋</button>
    </div>
  </article>`;
}

/* ---------- 導覽 ---------- */
$("chips").onclick = e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  const v = b.dataset.view;
  state.view = (state.area === null && state.view === v) ? "all" : v;
  render();
};
$("search").oninput = e => { state.q = e.target.value; render(); };
$("backBtn").onclick = () => {
  if (state.labels) { state.labels = false; window.scrollTo(0, 0); render(); return; }
  if (state.view !== "all" || state.q) {
    state.view = "all"; state.q = ""; $("search").value = "";
    if (state.area === null) { render(); return; }
  }
  state.area = null; state.view = "all";
  render();
};
$("topLink").onclick = () => {
  if (state.labels) { window.print(); return; }
  if (state.area === null) signOut(auth);
  else openAreaEditor(areas.find(a => a.id === state.area));
};
$("fab").onclick = () => state.area === null ? openAreaEditor(null) : openEditor(null);

$("list").onclick = async e => {
  if (e.target.closest("[data-newarea]")) { openAreaEditor(null); return; }
  if (e.target.closest("[data-labels]")) { state.labels = true; window.scrollTo(0, 0); render(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp.dataset.copy, cp); return; }
  if (e.target.closest("[data-scroll]")) { $("areasSec")?.scrollIntoView({ behavior: "smooth" }); return; }
  const sv = e.target.closest(".stat[data-view]");
  if (sv) { state.view = sv.dataset.view; window.scrollTo(0, 0); render(); return; }
  const mv = e.target.closest("[data-move]");
  if (mv) {
    await updateDoc(doc(db, "users", uid, "items", mv.dataset.move),
      { areaId: state.area, location: "", updatedAt: serverTimestamp() });
    state.q = ""; $("search").value = "";
    render();
    return;
  }
  const row = e.target.closest(".arow");
  if (row) {
    state.area = row.dataset.area; state.view = "all"; state.q = ""; $("search").value = "";
    window.scrollTo(0, 0); render(); return;
  }
  const card = e.target.closest(".card"); if (!card) return;
  const it = items.find(i => i.id === card.dataset.id); if (!it) return;
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act) {
    const q = Math.max(0, (it.qty ?? 0) + (act === "inc" ? 1 : -1));
    await updateDoc(doc(db, "users", uid, "items", it.id), { qty: q, updatedAt: serverTimestamp() });
    return;
  }
  openEditor(it);
};

/* ---------- 區域編輯 ---------- */
let pickedEmoji = EMOJIS[0];
function drawEmojis() {
  const custom = !EMOJIS.includes(pickedEmoji);
  $("emojiPick").innerHTML = EMOJI_GROUPS.map(([g, list]) =>
    `<div class="egroup">${g}</div>` + list.map(em =>
      `<button type="button" class="${em === pickedEmoji ? "on" : ""}" data-em="${em}">${em}</button>`).join("")
  ).join("");
  $("aEmoji").value = custom ? pickedEmoji : "";
}
$("aEmoji").oninput = e => {
  const v = [...e.target.value.trim()].slice(0, 4).join("");
  if (v) { pickedEmoji = v; $("emojiPick").querySelectorAll(".on").forEach(b => b.classList.remove("on")); }
};
$("emojiPick").onclick = e => {
  const b = e.target.closest("[data-em]"); if (!b) return;
  pickedEmoji = b.dataset.em; drawEmojis();
};
function openAreaEditor(a) {
  editingArea = a ? a.id : null;
  $("areaTitle").textContent = a ? "編輯區域" : "新增區域";
  $("aName").value = a?.name || "";
  pickedEmoji = a?.emoji || EMOJIS[0];
  drawEmojis();
  $("aDel").hidden = !a;
  $("aLinkBox").hidden = !a;
  $("aLink").value = a ? areaURL(a.id) : "";
  $("areaDlg").showModal();
}
$("aCancel").onclick = () => $("areaDlg").close();
$("aCopy").onclick = () => copyText($("aLink").value, $("aCopy"));
$("areaForm").onsubmit = async e => {
  e.preventDefault();
  const name = $("aName").value.trim(); if (!name) return;
  $("aSave").disabled = true;
  try {
    if (editingArea) {
      await updateDoc(doc(db, "users", uid, "areas", editingArea), { name, emoji: pickedEmoji });
    } else {
      const ref = await addDoc(collection(db, "users", uid, "areas"),
        { name, emoji: pickedEmoji, order: Date.now(), createdAt: serverTimestamp() });
      state.area = ref.id; state.view = "all"; state.q = ""; $("search").value = "";
    }
    $("areaDlg").close();
    render();
  } catch (err) { alert("儲存失敗:" + err.message); }
  finally { $("aSave").disabled = false; }
};
$("aDel").onclick = async () => {
  const id = editingArea; if (!id) return;
  const inside = items.filter(it => it.areaId === id);
  const msg = inside.length
    ? `這個區域裡還有 ${inside.length} 樣東西,會一起刪除。確定嗎?`
    : "確定要刪除這個區域?";
  if (!confirm(msg)) return;
  $("areaDlg").close();
  state.area = null; state.view = "all";
  for (const it of inside) {
    await deleteDoc(doc(db, "users", uid, "items", it.id));
    await deleteDoc(doc(db, "users", uid, "photos", it.id)).catch(() => {});
  }
  await deleteDoc(doc(db, "users", uid, "areas", id));
  render();
};

/* ---------- 物品編輯 ---------- */
function setPhotoBox(src) {
  $("photoBox").innerHTML = src ? `<img src="${src}" alt="">` : `<span>還沒有照片</span>`;
  $("removePhoto").hidden = !src;
}

async function openEditor(it) {
  if (!areas.length) { alert("請先建立一個區域"); openAreaEditor(null); return; }
  editing = it ? it.id : null;
  photo = { changed: false, full: null, thumb: null };
  $("formTitle").textContent = it ? "編輯物品" : "新增物品";
  $("fName").value = it?.name || "";
  $("fQty").value = it ? (it.qty ?? 0) : 1;
  $("fExpiry").value = it?.expiry || "";
  $("fLoc").value = it?.location || "";
  $("fNote").value = it?.note || "";
  const cur = it ? (areaOf(it) ? it.areaId : "") : (state.area !== NO_AREA ? state.area : "");
  $("fArea").innerHTML = (cur ? "" : `<option value="">請選擇區域</option>`) +
    areas.map(a => `<option value="${a.id}" ${a.id === cur ? "selected" : ""}>${esc(a.emoji)} ${esc(a.name)}</option>`).join("");
  $("delBtn").hidden = !it;
  $("dupWarn").hidden = true;
  if (it) {
    const a = areaLabel(areaKey(it));
    $("whereBox").innerHTML = `<b>📍 放在這裡</b>${esc(a.emoji)} ${esc(a.name)}${it.location ? " · " + esc(it.location) : ""}`;
    $("whereBox").hidden = false;
  } else $("whereBox").hidden = true;
  setPhotoBox(it?.thumb || null);
  $("editor").showModal();
  if (it?.hasPhoto) {
    try {
      const snap = await getDoc(doc(db, "users", uid, "photos", it.id));
      if (snap.exists() && editing === it.id && !photo.changed) setPhotoBox(snap.data().data);
    } catch (e) { /* 縮圖已顯示,忽略 */ }
  }
}

$("cancelBtn").onclick = () => $("editor").close();

// 新增時,名稱跟任何區域的現有物品重複就提醒
$("fName").oninput = () => {
  if (editing) return;
  const n = norm($("fName").value);
  const hits = n ? items.filter(i => norm(i.name) === n || (n.length >= 2 && norm(i.name).includes(n))) : [];
  const w = $("dupWarn");
  if (!hits.length) { w.hidden = true; return; }
  w.hidden = false;
  w.innerHTML = "⚠️ 你已經有:" + hits.slice(0, 4).map(h => {
    const a = areaLabel(areaKey(h));
    return `${esc(h.name)} ×${h.qty ?? 0}(${esc(a.name)}${h.location ? "・" + esc(h.location) : ""})${h.expiry ? "," + expiryText(h) : ""}`;
  }).join(";");
};

/* ---------- 照片 ---------- */
$("pickPhoto").onclick = () => $("fileInput").click();
$("removePhoto").onclick = () => { photo = { changed: true, full: null, thumb: null }; setPhotoBox(null); };

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = rej;
    img.src = url;
  });
}
function toJpeg(img, max, quality) {
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", quality);
}
$("fileInput").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const img = await loadImage(file);
    let q = 0.75, full = toJpeg(img, 1280, q);
    while (full.length > 700000 && q > 0.3) { q -= 0.1; full = toJpeg(img, 1100, q); }
    photo = { changed: true, full, thumb: toJpeg(img, 240, 0.7) };
    setPhotoBox(full);
  } catch (err) { alert("照片讀取失敗,請換一張試試"); }
};

/* ---------- 儲存 / 刪除物品 ---------- */
$("form").onsubmit = async e => {
  e.preventDefault();
  const name = $("fName").value.trim();
  if (!name) return;
  const areaId = $("fArea").value;
  if (!areaId) { alert("請選擇區域"); return; }
  const data = {
    name, areaId,
    qty: Math.max(0, parseInt($("fQty").value, 10) || 0),
    expiry: $("fExpiry").value || null,
    location: $("fLoc").value.trim(),
    note: $("fNote").value.trim(),
    updatedAt: serverTimestamp()
  };
  if (photo.changed) { data.thumb = photo.thumb; data.hasPhoto = !!photo.full; }

  $("saveBtn").disabled = true;
  try {
    let id = editing;
    if (id) {
      await updateDoc(doc(db, "users", uid, "items", id), data);
    } else {
      data.createdAt = serverTimestamp();
      if (!photo.changed) { data.thumb = null; data.hasPhoto = false; }
      id = (await addDoc(collection(db, "users", uid, "items"), data)).id;
    }
    if (photo.changed) {
      const ref = doc(db, "users", uid, "photos", id);
      if (photo.full) await setDoc(ref, { data: photo.full });
      else await deleteDoc(ref);
    }
    $("editor").close();
  } catch (err) {
    alert("儲存失敗:" + err.message);
  } finally {
    $("saveBtn").disabled = false;
  }
};

$("delBtn").onclick = async () => {
  if (!editing || !confirm("確定要刪除這個物品?")) return;
  const id = editing;
  $("editor").close();
  await deleteDoc(doc(db, "users", uid, "items", id));
  await deleteDoc(doc(db, "users", uid, "photos", id)).catch(() => {});
};
